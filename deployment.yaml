apiVersion: apps/v1
kind: Deployment
metadata:
  name: payroll-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payroll-app
  template:
    metadata:
      labels:
        app: payroll-app
    spec:
      containers:
      - name: payroll-app
        image: your-dockerhub-username/payroll-management-system:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: payroll-service
spec:
  type: NodePort
  selector:
    app: payroll-app
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30008